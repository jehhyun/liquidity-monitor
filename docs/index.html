<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Fat Cat Capital — Liquidity Monitor 2.0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif;padding:20px 16px 60px;max-width:1440px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.eyebrow{font-size:10px;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tagline{font-size:11px;color:#555;margin-top:4px}
.live{font-size:11px;color:#97C459;margin-bottom:2px}
.ts{font-size:10px;color:#3a3a3a;line-height:1.6;text-align:right}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:14px;color:#444}
.err{background:#1a1212;border:1px solid #3a1a1a;border-radius:8px;padding:14px;color:#a55;font-size:12px;margin:20px 0}

.panel{background:#141414;border:1px solid #232323;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.panel-hd{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#666;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-hd .sub{font-size:9px;color:#3a3a3a;text-transform:none;letter-spacing:0;font-weight:400}
.layer-lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#3a3a3a;margin:22px 0 8px;padding-top:14px;border-top:1px solid #1c1c1c}
.layer-lbl:first-child{margin-top:0;border-top:none;padding-top:0}

/* Top grid: regime + transmission + signal summary */
.top-grid{display:grid;grid-template-columns:1.1fr 1.6fr 1.1fr;gap:12px;align-items:start}
@media(max-width:1100px){.top-grid{grid-template-columns:1fr}}

/* 1. Regime header */
.regime-box{border-radius:8px;padding:12px 14px;margin-bottom:10px}
.regime-box.green{background:#0f1a0f;border:1px solid #1e3a1e}
.regime-box.amber{background:#1a1608;border:1px solid #3a2e0e}
.regime-box.red{background:#1a1010;border:1px solid #3a1a1a}
.regime-badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#888;background:#111;display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:8px}
.regime-title{font-size:18px;font-weight:800;line-height:1.2;margin-bottom:8px}
.regime-oneliner{font-size:11.5px;color:#999;line-height:1.5}
.evidence-list{margin-top:4px}
.ev-row{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:#999;line-height:1.5;margin-bottom:5px}
.ev-icon{flex-shrink:0;width:13px}

/* 2. Transmission diagram */
.tx-flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tx-box{flex:1;min-width:150px;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:8px;padding:9px 10px}
.tx-box.purple{border-color:#3a2e5a;background:#140f1e}
.tx-box.blue{border-color:#1e3050;background:#0c141e}
.tx-title{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#aaa;margin-bottom:6px}
.tx-item{font-size:10px;color:#666;line-height:1.5}
.tx-state{font-size:11px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid #232323}
.tx-arrow{align-self:center;color:#3a3a3a;font-size:14px;flex-shrink:0}
.tx-feedback{font-size:9.5px;color:#3a3a3a;text-align:center;margin:4px 0 10px;line-height:1.6}
.bottom-line{background:#161305;border:1px solid #3a2e0e;border-radius:8px;padding:10px 12px;font-size:11.5px;line-height:1.55}
.bottom-line b{color:#EF9F27}

/* 3. Signal summary table */
.sig-table{width:100%;border-collapse:collapse}
.sig-table td{font-size:11px;padding:5px 4px;border-bottom:1px solid #1c1c1c;vertical-align:middle}
.sig-table td:first-child{color:#888}
.sig-table td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px}
.ohl{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:7px;padding:9px 11px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}

/* 4. Dashboards */
.dash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.dash-grid{grid-template-columns:1fr}}
.mini-table{width:100%;border-collapse:collapse;margin-bottom:8px}
.mini-table th{font-size:8.5px;color:#444;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:3px 5px;border-bottom:1px solid #232323}
.mini-table td{font-size:10.5px;padding:4px 5px;border-bottom:1px solid #1a1a1a;color:#888}
.mini-table td:first-child{color:#ddd;font-weight:500}
.so-what{background:#0f0f0f;border-left:3px solid #EF9F27;border-radius:0 6px 6px 0;padding:7px 9px;font-size:10.5px;color:#999;line-height:1.5;margin-top:6px}
.so-what b{color:#EF9F27}
.chartline{display:flex;align-items:flex-end;gap:2px;height:70px;margin:8px 0}
.chartbar{flex:1;border-radius:2px 2px 0 0;min-height:2px;position:relative}
.chart-lbl{font-size:8px;color:#3a3a3a;text-align:center;margin-top:3px}
.big-stat{font-size:22px;font-weight:800;font-family:ui-monospace,'SF Mono',monospace;line-height:1}
.stat-delta{font-size:10.5px;margin-top:3px}

/* 5/6/9 tables */
.abs-table{width:100%;border-collapse:collapse}
.abs-table th{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 6px;border-bottom:1px solid #232323}
.abs-table td{font-size:10.5px;padding:6px 6px;border-bottom:1px solid #1a1a1a;color:#888;vertical-align:top}
.abs-table td:first-child{color:#ddd;font-weight:500;white-space:nowrap}
.chip{font-size:9px;padding:2px 7px;border-radius:4px;display:inline-block;white-space:nowrap}
.chip.pending{background:#141414;color:#555;border:1px solid #262626}

/* 7. posture */
.posture-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:800px){.posture-grid{grid-template-columns:1fr}}
.posture-col-hd{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;font-weight:700}
.posture-item{font-size:11px;color:#999;padding:5px 0 5px 18px;position:relative;line-height:1.4}
.posture-item::before{position:absolute;left:0;font-size:12px}
.posture-item.pos::before{content:'✓';color:#97C459}
.posture-item.neg::before{content:'✕';color:#E24B4A}

/* 8/9 grids */
.takeaway-list{list-style:none}
.takeaway-list li{font-size:11.5px;color:#999;line-height:1.55;padding:5px 0 5px 16px;position:relative}
.takeaway-list li::before{content:'•';position:absolute;left:0;color:#EF9F27}
.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:900px){.scenario-grid{grid-template-columns:1fr}}
.scenario-card{border-radius:8px;padding:12px 13px}
.scenario-card.base{background:#0f1a0f;border:1px solid #1e3a1e}
.scenario-card.up{background:#0f1a0f;border:1px solid #1e3a1e;opacity:.9}
.scenario-card.down{background:#1a1010;border:1px solid #3a1a1a}
.scenario-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:4px}
.scenario-title{font-size:13px;font-weight:800;margin-bottom:3px;line-height:1.25}
.scenario-prob{font-size:10.5px;color:#666;margin-bottom:8px}
.scenario-item{font-size:10.5px;color:#999;padding:2px 0 2px 14px;position:relative;line-height:1.4}
.scenario-item::before{content:'✓';position:absolute;left:0;color:#97C459;font-size:9px}

/* 10. events */
.events-list{display:flex;flex-direction:column;gap:6px}
.event-row{display:flex;gap:9px;align-items:flex-start;background:#0f0f0f;border-radius:6px;padding:7px 9px}
.event-date{font-size:10px;font-weight:700;color:#EF9F27;width:52px;flex-shrink:0;line-height:1.3}
.event-time{font-size:9px;color:#444}
.event-name{font-size:10.5px;color:#ddd;font-weight:500}
.event-why{font-size:9.5px;color:#555;line-height:1.4}
.event-row.validation{border-left:2px solid #EF9F27}

/* Raw data (bottom layer) — reuse original card styles */
.sec{margin-bottom:18px}
.sl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#3a3a3a;font-weight:600;border-bottom:1px solid #1a1a1a;padding-bottom:5px;margin-bottom:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.g6{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.card{background:#181818;border:1px solid #252525;border-radius:8px;padding:11px 13px;cursor:pointer;user-select:none}
.card.red{border-color:#3a1a1a;background:#1a1212}
.card.amber{border-color:#2e2800}
.card.green{border-color:#1a2e1a}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:6px}
.cl{font-size:10px;color:#666;line-height:1.3;flex:1}
.cc{font-size:9px;color:#3a3a3a;background:#111;padding:1px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.cv{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1;color:#f0f0f0;font-family:ui-monospace,'SF Mono',monospace;margin-bottom:4px}
.cd{font-size:11px;min-height:14px}
.ci{display:none;font-size:11px;color:#666;line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid #252525}
.ctog{text-align:right;font-size:9px;color:#2a2a2a;margin-top:3px}
.card.open .ci{display:block}
.pills{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pill{font-size:10px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:4px;padding:2px 8px;color:#888}
.chain{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.footer-bar{font-size:9px;color:#3a3a3a;margin-top:16px;cursor:pointer}
.footer-detail{display:none;font-size:9px;color:#2e2e2e;margin-top:4px;line-height:1.8}
@media(max-width:600px){.g6,.chain{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading latest data…</div></div>

<script>
const C = { red:'#E24B4A', amber:'#EF9F27', green:'#97C459', grey:'#555', blue:'#4a8fd4', purple:'#8f6fd4' };
const col = k => C[k] || C.grey;
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function tog(el){ el.classList.toggle('open'); const t=el.querySelector('.ctog'); if(t) t.innerHTML=el.classList.contains('open')?'&#9650;':'&#9660;' }
function fmt(n,d){ return (n===null||n===undefined) ? '—' : Number(n).toFixed(d===undefined?2:d) }
function boxColor(bucket){ return bucket==='HEALTHY'||bucket==='HIGH RESILIENCE' ? 'green' : (bucket==='WEAK'?'red':'amber') }

function render(d) {
  const meta = d.meta || {};
  const v2 = d.v2 || {};
  const rh = v2.regime_header || {};
  const ms = v2.master_scores || {};
  const tx = v2.transmission || {};
  const ct = v2.curve_topology || {};
  const ry = v2.real_yield_breakeven || {};
  const sd = v2.structural_demand || {};
  const sat = v2.shock_absorbers_table || [];
  const adash = v2.auction_dashboard || [];
  const nke = v2.next_key_events || [];
  const scen = v2.scenarios || {};
  const tt = v2.transition_triggers || {};
  const tp = v2.trade_posture_v2 || {};
  const takeaways = v2.key_takeaways || [];

  const regimeColor = ms.system_regime === 'Controlled Tightening / Liquidity Protected' ? 'green'
    : ms.system_regime === 'Liquidity Contraction / Risk-Off' ? 'red'
    : ms.system_regime === 'Liquidity-Driven Risk-On' ? 'green' : 'amber';

  // ---------- SECTION 1: regime header ----------
  const evidenceHtml = (rh.evidence||[]).map(e => {
    const icon = e.ok===true ? `<span style="color:${C.green}">✓</span>` : (e.ok===false ? `<span style="color:${C.red}">✕</span>` : `<span style="color:${C.grey}">?</span>`);
    return `<div class="ev-row"><span class="ev-icon">${icon}</span><span>${esc(e.text)}</span></div>`;
  }).join('');
  const sec1 = `
  <div class="panel">
    <div class="panel-hd">1. The Big Picture <span class="sub">Current Regime</span></div>
    <div class="regime-box ${regimeColor}">
      <div class="regime-badge">${rh.provisional?'Provisional':'Confirmed'}</div>
      <div class="regime-title" style="color:${col(regimeColor)}">${esc(rh.label||'—')}</div>
      <div class="regime-oneliner">${esc(rh.one_liner||'')}</div>
    </div>
    <div class="panel-hd" style="margin-top:4px">Why this regime?</div>
    <div class="evidence-list">${evidenceHtml}</div>
  </div>`;

  // ---------- SECTION 2: transmission architecture ----------
  const boxes = [
    {cls:'', title:'Drivers', items:(tx.drivers||[]), state:null},
    {cls:'', title:'Monetary Restrictiveness', items:(tx.monetary_restrictiveness||{}).bullets||[], state:(tx.monetary_restrictiveness||{}).state, stateColor:'amber'},
    {cls:'purple', title:'Official-Sector Shock Absorbers', items:(tx.shock_absorbers||{}).bullets||[], state:(tx.shock_absorbers||{}).state, stateColor:'amber'},
    {cls:'blue', title:'Market Liquidity Outcome', items:(tx.liquidity_outcome||{}).bullets||[], state:(tx.liquidity_outcome||{}).state, stateColor:'green'},
    {cls:'', title:'Market Impact', items:(tx.market_impact||{}).bullets||[], state:null},
  ];
  const txHtml = boxes.map((b,i) => `
    ${i>0?'<div class="tx-arrow">→</div>':''}
    <div class="tx-box ${b.cls}">
      <div class="tx-title">${esc(b.title)}</div>
      ${(b.items||[]).map(it=>`<div class="tx-item">• ${esc(it)}</div>`).join('')}
      ${b.state?`<div class="tx-state" style="color:${col(b.stateColor)}">${esc(b.state)}</div>`:''}
    </div>`).join('');
  const sec2 = `
  <div class="panel">
    <div class="panel-hd">2. Transmission Architecture <span class="sub">where we are now</span></div>
    <div class="tx-flow">${txHtml}</div>
    <div class="tx-feedback">Feedback loops: higher yields → fiscal costs → issuance decisions → term premium · market stress → wider spreads → tighter conditions → policy response</div>
    <div class="bottom-line"><b>BOTTOM LINE:</b> ${esc(tx.bottom_line||'')}</div>
  </div>`;

  // ---------- SECTION 3: signal summary ----------
  const sigRows = [
    ['Monetary Restrictiveness', `${(ms.monetary_restrictiveness||{}).value}/100 — ${(ms.monetary_restrictiveness||{}).label}`, (ms.monetary_restrictiveness||{}).bucket==='HIGH'?'amber':'green'],
    ['Liquidity Resilience', `${(ms.liquidity_resilience||{}).value}/100 — ${(ms.liquidity_resilience||{}).label}`, (ms.liquidity_resilience||{}).bucket==='HIGH'?'green':'red'],
    ['Curve Shape', esc(ct.classification||'—'), 'amber'],
    ['Real Yield / Breakeven', esc(ry.classification||'—'), 'amber'],
    ['Credit Spreads (HY OAS)', `${(d.credit||{}).hy_oas}% — ${(d.credit||{}).hy_oas_delta||''}`, (d.credit||{}).hy_oas_color||'grey'],
    ['MOVE Index', `${fmt((d.duration||{}).move,1)} — ${(d.duration||{}).move_delta||''}`, (d.duration||{}).move_color||'grey'],
    ['SOFR − IORB', `${fmt((d.plumbing||{}).sofr_iorb_bps,1)} bp`, 'green'],
    ['Auction Absorption (last 3)', `${(d.treasury_auctions||{}).absorption_score}/100`, 'green'],
    ['Korea Gate', `${(d.korea_gate||{}).conditions_met}/3 — ${(d.korea_gate||{}).status==='open'?'OPEN':'CLOSED'}`, (d.korea_gate||{}).status==='open'?'green':'red'],
  ];
  const sigHtml = sigRows.map(([l,v,c])=>`<tr><td><span class="dot" style="background:${col(c)}"></span>${esc(l)}</td><td style="color:${col(c)}">${v}</td></tr>`).join('');
  const sec3 = `
  <div class="panel">
    <div class="panel-hd">3. Current Signal Summary</div>
    <table class="sig-table">${sigHtml}</table>
    <div class="ohl">
      <div>
        <div style="font-size:9px;color:#666;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px">System Regime</div>
        <div style="font-size:13px;font-weight:800;color:${col(regimeColor)}">${esc(ms.system_regime||'—')}</div>
      </div>
      <div style="font-size:9px;color:#555;text-align:right">${esc(ms.regime_signal||'')}</div>
    </div>
  </div>`;

  // ---------- SECTION 4: dashboards ----------
  const curvePts = ct.points||{};
  const curveVals = [curvePts.us02y,curvePts.us05y,curvePts.us10y,curvePts.us30y].filter(x=>x!=null);
  const maxC = Math.max(...curveVals,1), minC = Math.min(...curveVals,0);
  const curveBars = ['us02y','us05y','us10y','us30y'].map((k,i)=>{
    const v = curvePts[k]; if(v==null) return '';
    const h = Math.max(6, ((v-minC)/((maxC-minC)||1))*60+8);
    return `<div class="chartbar" style="height:${h}px;background:${C.amber}"></div>`;
  }).join('');
  const sec4a = `
  <div class="panel">
    <div class="panel-hd">4A. Curve Topology</div>
    <div class="chartline">${curveBars}</div>
    <div style="display:flex;gap:0" class="mini-table"><table class="mini-table" style="width:100%"><tr><td>2Y</td><td>5Y</td><td>10Y</td><td>30Y</td></tr><tr><td>${fmt(curvePts.us02y)}%</td><td>${fmt(curvePts.us05y)}%</td><td>${fmt(curvePts.us10y)}%</td><td>${fmt(curvePts.us30y)}%</td></tr></table></div>
    <div style="font-size:10px;color:#666;margin-top:4px">2s10s spread: <b style="color:#ddd">${fmt(curvePts.spread_2s10s,3)}%</b></div>
    <div class="so-what"><b>SO WHAT?</b> ${esc(ct.so_what||'')}</div>
  </div>`;

  const sec4b = `
  <div class="panel">
    <div class="panel-hd">4B. Real Yield &amp; Breakevens</div>
    <div class="big-stat" style="color:${col('amber')}">${fmt(ry.real_10y_derived)}%</div>
    <div class="stat-delta" style="color:#666">10Y real yield (derived)</div>
    <table class="mini-table" style="margin-top:8px">
      <tr><td>10Y Nominal</td><td style="text-align:right">${fmt(ry.nominal_10y)}%</td></tr>
      <tr><td>10Y Breakeven</td><td style="text-align:right">${fmt(ry.breakeven_10y)}%</td></tr>
      <tr><td>DFII5 (primary)</td><td style="text-align:right">${fmt(ry.dfii5)}%</td></tr>
      <tr><td>DFII10 (confirm)</td><td style="text-align:right">${fmt(ry.dfii10)}%</td></tr>
    </table>
    <div class="so-what"><b>SO WHAT?</b> ${esc(ry.so_what||'')}</div>
  </div>`;

  const cx = d.crosschecks || {};
  const cred = d.credit || {};
  const dur = d.duration || {};
  const sec4c = `
  <div class="panel">
    <div class="panel-hd">4C. Volatility &amp; Credit</div>
    <table class="mini-table">
      <tr><th>Metric</th><th style="text-align:right">Level</th><th style="text-align:right">Δ</th></tr>
      <tr><td>MOVE Index</td><td style="text-align:right">${fmt(dur.move,1)}</td><td style="text-align:right;color:${col(dur.move_color)}">${esc(dur.move_delta||'')}</td></tr>
      <tr><td>VIX</td><td style="text-align:right">${fmt((cx.vix||{}).value,2)}</td><td style="text-align:right;color:${col((cx.vix||{}).color)}">${esc((cx.vix||{}).delta||'')}</td></tr>
      <tr><td>HY OAS</td><td style="text-align:right">${fmt(cred.hy_oas,2)}%</td><td style="text-align:right;color:${col(cred.hy_oas_color)}">${esc(cred.hy_oas_delta||'')}</td></tr>
      <tr><td>SOFR − IORB</td><td style="text-align:right">${fmt((d.plumbing||{}).sofr_iorb_bps,1)}bp</td><td style="text-align:right;color:${C.green}">Normal</td></tr>
    </table>
    <div class="so-what"><b>SO WHAT?</b> Bond and equity vol both contained (MOVE ${esc(dur.move_delta||'')}, VIX near multi-week lows); HY OAS flat and funding spread normal — no sign of credit or liquidity stress feeding into the tightening picture.</div>
  </div>`;

  const sec4d = `
  <div class="panel">
    <div class="panel-hd">4D. Master Scores</div>
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:10px;color:#888">Monetary Restrictiveness</span><span style="font-size:16px;font-weight:800;color:${col('amber')}">${(ms.monetary_restrictiveness||{}).value}/100</span></div>
      <div style="height:5px;background:#1a1a1a;border-radius:3px;margin-top:3px;overflow:hidden"><div style="height:5px;width:${(ms.monetary_restrictiveness||{}).value}%;background:${C.amber}"></div></div>
      <div style="font-size:9.5px;color:#555;margin-top:2px">${esc((ms.monetary_restrictiveness||{}).label||'')}</div>

  const sec4f = `

  // ---------- SECTION 5: shock absorbers ----------
  const satRows = sat.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.track)}</td><td><span class="chip pending">Pending data source</span></td></tr>`).join('');
  const sec5 = `
  <div class="panel">
    <div class="panel-hd">5. Official-Sector Shock Absorbers</div>

  // ---------- SECTION 6: auction dashboard ----------
  const adashRows = adash.map(a=>{

  const sec6 = `

  // ---------- SECTION 7: implications & trade posture ----------
  const favHtml = (tp.favors||[]).map(x=>`<div class="posture-item pos">${esc(x)}</div>`).join('');

  <div class="panel">

  // ---------- SECTION 10: next key events ----------
  const eventsHtml = nke.map(e=>{

  }).join('');
  const sec10 = `
  <div class="panel">

  // ---------- BOTTOM LAYER: raw data (reuse existing sections) ----------

  const chainCards = (d.chain||[]).map(c=>`

  const rawData = `
  <div class="sec">

        {l:'Net Liquidity',v:'$'+fmt(p.net_liquidity_t,3)+'T',d:p.tga_delta,c:p.tga_color,n:'WALCL − TGA − RRP.'},

        {l:'RRP',v:'$'+fmt(p.rrp_b,3)+'B',d:p.rrp_delta,c:p.rrp_color,n:'Reverse repo facility usage.'},

      ].map(x=>`<div class="card ${x.c}" onclick="tog(this)">
        <div class="ct"><span class="cl">${esc(x.l)}</span><span class="cc">FRED</span></div>
        <div class="cv">${esc(x.v)}</div>
        <div class="cd" style="color:${col(x.c)}">${esc(x.d)}</div>
        <div class="ci">${esc(x.n)}</div>
        <div class="ctog">▼</div>
      </div>`).join('')}

  </div>

  <div class="sec">

    <div class="g4">
      ${[
        {l:'USDJPY',v:fx.usdjpy,d:esc(fx.usdjpy_note),c:fx.usdjpy_alert?'red':'green'},

      ].map(x=>`<div class="card ${x.c}" onclick="tog(this)">
        <div class="ct"><span class="cl">${esc(x.l)}</span><span class="cc">Live</span></div>
        <div class="cv">${esc(String(x.v))}</div>
        <div class="cd" style="color:${col(x.c)}">${x.d}</div>
        <div class="ctog">▼</div>
      </div>`).join('')}
    </div>
    <div class="pills">
      <div class="pill">JP10Y: <strong style="color:#f0f0f0">${fx.jp10y}%</strong></div>
      <div class="pill">NI225: <strong style="color:${C.green}">${(fx.ni225/1000).toFixed(1)}K</strong></div>
      <div class="pill">USDCNY: <strong style="color:#f0f0f0">${fx.usdcny}</strong></div>
    </div>
  </div>

  <div class="sec">
    <div class="sl">Korea gate — 3-condition framework</div>
    <div style="background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">

          <div style="font-size:10px;color:#666;margin-bottom:2px">EWY</div>

          <div style="font-size:9px;color:#888;text-transform:uppercase">Gate status</div>

  <div class="sec">
    <div class="sl">Semis pulse — tactical</div>
    <div class="g4">
      ${[
        {l:'SOXX',v:'$'+sm.soxx,d:sm.soxx_delta,c:sm.soxx_color},
        {l:'QQQ',v:'$'+sm.qqq,d:sm.qqq_delta,c:sm.qqq_color},

        {l:'SOXX/SPY ratio',v:sm.soxx_spy_ratio,d:'—',c:'grey'},

        <div class="ct"><span class="cl">${esc(x.l)}</span><span class="cc">Live</span></div>
        <div class="cv">${esc(String(x.v))}</div>
        <div class="cd" style="color:${col(x.c)}">${esc(x.d)}</div>
        <div class="ctog">▼</div>
      </div>`).join('')}

  </div>

  <div class="sec">
    <div class="sl">Enabling-layer thesis chain</div>
    <div class="chain">${chainCards}</div>
    <div style="font-size:9.5px;color:#3a3a3a;margin-top:6px">${esc(d.chain_note||'')}</div>
  </div>

  <div class="sec">
    <div class="sl">Macro cross-checks — tactical</div>
    <div class="g4">
      ${(()=>{
        const labels = {vix:'VIX', oil:'CL1! — Crude oil', gold:'GOLD', move:'MOVE — Bond vol'};
        return Object.entries(labels).map(([k,l])=>{
          const x = cx[k] || {value:'—', delta:'', color:'grey', note:''};
          return `<div class="card ${x.color}" onclick="tog(this)">
            <div class="ct"><span class="cl">${l}</span><span class="cc">Live</span></div>
            <div class="cv">${esc(String(x.value))}</div>
            <div class="cd" style="color:${col(x.color)}">${esc(x.delta)}</div>
            <div class="ci">${esc(x.note)}</div>
            <div class="ctog">▼</div>
          </div>`;
        }).join('');
      })()}
    </div>
  </div>`;

  document.getElementById('app').innerHTML = `
  <div class="hdr">
    <div>
      <div class="eyebrow">Fat Cat Capital</div>
      <h1>Liquidity Monitor 2.0 — Current State &amp; Framework</h1>
      <div class="tagline">Track the plumbing. Understand the transmission. Trade the regime.</div>
    </div>
    <div class="ts"><div class="live">● Live</div>Last updated<br>${esc(meta.pulled_at_cet||'')}</div>
  </div>

  <div class="layer-lbl">Top layer — current regime + transmission</div>
  <div class="top-grid">${sec1}${sec2}${sec3}</div>

  <div class="layer-lbl">Middle layer — why the regime exists</div>
  <div class="panel-hd" style="margin-bottom:10px">4. Key Dashboards <span class="sub">(with so what)</span></div>
  <div class="dash-grid">${sec4a}${sec4b}${sec4c}${sec4d}${sec4e}${sec4f}</div>
  ${sec5}
  ${sec6}
  ${sec7}
  ${sec8}
  ${sec9}
  ${sec10}

  <div class="layer-lbl">Bottom layer — raw data / detailed indicators</div>
  ${rawData}

  <div class="footer-bar" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">ⓘ Data sources &amp; methodology notes</div>
  <div class="footer-detail">
    FRED: WALCL · WTREGEN · RRPONTSYD · WRESBAL · SOFR · IORB | TradingView "Liquidity Monitor - Jae" watchlist | TreasuryDirect TA_WS + NY Fed PDPOSGST-TOT (auctions/dealer inventory) |
    Monetary Restrictiveness &amp; Liquidity Resilience scores: v1 methodology, documented in SKILL.md — refine as history accumulates |
    Official-sector shock absorbers (buybacks, MMF, stablecoin, bank/corporate demand): not yet wired into the scrape pipeline — shown as pending, never fabricated |
    Curve topology &amp; real yield/breakeven classifications are derived, not raw feeds |
    Dashboard reads data/latest.json on load — automation writes JSON only, never HTML. This version of docs/index.html was authored directly per an explicit user redesign request (2026-08-30), an exception to the JSON-only automation rule, which continues to apply to the scheduled refresh runs.
  </div>`;
}

async function load() {
  try {
    const r = await fetch('data/latest.json?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="hdr"><div><div class="eyebrow">Fat Cat Capital</div><h1>Liquidity Monitor 2.0</h1></div></div>
      <div class="err">Failed to load latest.json: ${esc(e.message)}<br><br>
      This usually means the data file hasn't been pushed yet, or there's a network issue.</div>`;
  }
}
load();
</script>
