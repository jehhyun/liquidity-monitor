<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>Fat Cat Capital — Liquidity Monitor 2.1</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif;padding:20px 16px 60px;max-width:1440px;margin:0 auto}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.eyebrow{font-size:10px;color:#444;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.tagline{font-size:11px;color:#555;margin-top:4px}
.live{font-size:11px;color:#97C459;margin-bottom:2px}
.ts{font-size:10px;color:#3a3a3a;line-height:1.6;text-align:right;max-width:320px}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;font-size:14px;color:#444}
.err{background:#1a1212;border:1px solid #3a1a1a;border-radius:8px;padding:14px;color:#a55;font-size:12px;margin:20px 0}

.panel{background:#141414;border:1px solid #232323;border-radius:10px;padding:13px 15px;margin-bottom:12px;min-width:0}
.panel-hd{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#666;font-weight:700;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel-hd .sub{font-size:9px;color:#3a3a3a;text-transform:none;letter-spacing:0;font-weight:400}
.section-num{color:#3a3a3a;font-weight:400;margin-right:2px}
.layer-lbl{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#3a3a3a;margin:20px 0 8px;padding-top:12px;border-top:1px solid #1c1c1c}
.layer-lbl:first-child{margin-top:0;border-top:none;padding-top:0}

/* ROW 1: regime | master scores | signal summary */
.row1{display:grid;grid-template-columns:1.15fr 1fr 1.15fr;gap:12px;align-items:start}
@media(max-width:1000px){.row1{grid-template-columns:1fr}}
.regime-box{border-radius:8px;padding:11px 13px;margin-bottom:9px}
.regime-box.green{background:#0f1a0f;border:1px solid #1e3a1e}
.regime-box.amber{background:#1a1608;border:1px solid #3a2e0e}
.regime-box.red{background:#1a1010;border:1px solid #3a1a1a}
.regime-badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#888;background:#111;display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:7px}
.regime-title{font-size:16px;font-weight:800;line-height:1.2;margin-bottom:6px}
.regime-oneliner{font-size:11px;color:#999;line-height:1.45}
.conf-row{display:flex;justify-content:space-between;align-items:center;background:#0f0f0f;border:1px solid #232323;border-radius:6px;padding:7px 10px;margin-top:2px}
.conf-lbl{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:.05em}
.conf-val{font-size:12px;font-weight:800}

.score-block{margin-bottom:12px}
.score-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.score-name{font-size:10.5px;color:#999}
.score-num{font-size:18px;font-weight:800;font-family:ui-monospace,'SF Mono',monospace}
.score-bar-bg{height:6px;background:#1a1a1a;border-radius:3px;overflow:hidden}
.score-bar-fill{height:6px}
.score-label{font-size:9.5px;color:#555;margin-top:3px}
.matrix-note{font-size:9.5px;color:#444;line-height:1.5;margin-top:6px;padding-top:8px;border-top:1px solid #1e1e1e}

.sig-table{width:100%;border-collapse:collapse}
.sig-table td{font-size:10.5px;padding:4.5px 4px;border-bottom:1px solid #1c1c1c;vertical-align:middle}
.sig-table td:first-child{color:#888}
.sig-table td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;flex-shrink:0}
.fdot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:5px}

/* ROW 2: transmission, full width */
.tx-flow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tx-box{flex:1;min-width:148px;background:#0f0f0f;border:1px solid #2a2a2a;border-radius:8px;padding:9px 10px}
.tx-box.purple{border-color:#3a2e5a;background:#140f1e}
.tx-box.blue{border-color:#1e3050;background:#0c141e}
.tx-title{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#aaa;margin-bottom:6px}
.tx-item{font-size:9.5px;color:#666;line-height:1.45}
.tx-state{font-size:10.5px;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid #232323}
.tx-arrow{align-self:center;color:#3a3a3a;font-size:13px;flex-shrink:0}
.bottom-line{background:#161305;border:1px solid #3a2e0e;border-radius:8px;padding:9px 11px;font-size:11px;line-height:1.5}
.bottom-line b{color:#EF9F27}

/* ROW 3: bottom-line / why / confidence-decomp */
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:start}
@media(max-width:1000px){.row3{grid-template-columns:1fr}}
.ev-row{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;color:#999;line-height:1.45;margin-bottom:5px}
.ev-icon{flex-shrink:0;width:13px}
.conf-decomp-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a;font-size:10.5px;gap:8px}
.conf-decomp-row:last-child{border-bottom:none}
.conf-decomp-lbl{color:#999}
.conf-decomp-lvl{font-weight:700;white-space:nowrap;flex-shrink:0}

/* Pressure map */
.pressure-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #1a1a1a}
.pressure-row:last-child{border-bottom:none}
.pressure-chan{font-size:10.5px;color:#ddd;width:200px;flex-shrink:0}
.pressure-bar-bg{flex:1;height:7px;background:#1a1a1a;border-radius:4px;overflow:hidden;min-width:60px}
.pressure-bar-fill{height:7px}
.pressure-lvl{font-size:9px;font-weight:800;width:100px;text-align:right;flex-shrink:0}
.pressure-note{font-size:9.5px;color:#555;margin-top:2px;line-height:1.4}

/* Generic tables */
.mini-table{width:100%;border-collapse:collapse;margin-bottom:6px}
.mini-table th{font-size:8.5px;color:#444;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:3px 5px;border-bottom:1px solid #232323}
.mini-table td{font-size:10.5px;padding:4px 5px;border-bottom:1px solid #1a1a1a;color:#888}
.mini-table td:first-child{color:#ddd;font-weight:500}
.so-what{background:#0f0f0f;border-left:3px solid #EF9F27;border-radius:0 6px 6px 0;padding:7px 9px;font-size:10.5px;color:#999;line-height:1.5;margin-top:6px}
.so-what b{color:#EF9F27}
.classification-badge{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:5px;margin-bottom:6px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:800px){.two-col{grid-template-columns:1fr}}
.dash-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:900px){.dash-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.dash-grid{grid-template-columns:1fr}}

/* status chips */
.chip{font-size:8.5px;padding:2px 7px;border-radius:4px;display:inline-block;white-space:nowrap;font-weight:700;letter-spacing:.02em}
.chip.confirmed{background:#0f1a0f;color:#97C459;border:1px solid #1e3a1e}
.chip.proxy{background:#0c141e;color:#4a8fd4;border:1px solid #1e3050}
.chip.structural{background:#140f1e;color:#a98fe0;border:1px solid #3a2e5a}
.chip.pending{background:#141414;color:#666;border:1px solid #2a2a2a}
.chip.event{background:#1a1608;color:#EF9F27;border:1px solid #3a2e0e}

.abs-table{width:100%;border-collapse:collapse}
.abs-table th{font-size:9px;color:#444;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:5px 6px;border-bottom:1px solid #232323}
.abs-table td{font-size:10.5px;padding:6px 6px;border-bottom:1px solid #1a1a1a;color:#888;vertical-align:top}
.abs-table td:first-child{color:#ddd;font-weight:500;white-space:nowrap}
.abs-table tr.validation{background:#12100a}

/* Distance to transition */
.cond-list{margin-top:4px}
.cond-row{display:flex;gap:7px;align-items:flex-start;font-size:10.5px;line-height:1.4;margin-bottom:4px}
.cond-mark{flex-shrink:0;width:14px}
.distance-badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:5px;margin-top:6px}

/* State transition diagram */
.state-diagram{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:8px 0}
.state-node{flex:1;min-width:150px;border-radius:8px;padding:10px 12px;font-size:10.5px;text-align:center;border:1px solid #2a2a2a;background:#0f0f0f;color:#777}
.state-node.current{border-color:#3a2e0e;background:#1a1608;color:#EF9F27;font-weight:800}
.state-arrow2{color:#3a3a3a;font-size:16px;flex-shrink:0}

/* scenario / posture */
.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media(max-width:900px){.scenario-grid{grid-template-columns:1fr}}
.scenario-card{border-radius:8px;padding:11px 12px}
.scenario-card.base{background:#0f1a0f;border:1px solid #1e3a1e}
.scenario-card.up{background:#0f1a0f;border:1px solid #1e3a1e;opacity:.85}
.scenario-card.down{background:#1a1010;border:1px solid #3a1a1a}
.scenario-lbl{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:4px}
.scenario-title{font-size:12.5px;font-weight:800;margin-bottom:3px;line-height:1.25}
.scenario-item{font-size:10px;color:#999;padding:2px 0 2px 14px;position:relative;line-height:1.4}
.scenario-item::before{content:'✓';position:absolute;left:0;color:#97C459;font-size:9px}

.posture-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:800px){.posture-grid{grid-template-columns:1fr}}
.posture-col-hd{font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px;font-weight:700}
.posture-item{font-size:10.5px;color:#999;padding:4px 0 4px 17px;position:relative;line-height:1.4}
.posture-item::before{position:absolute;left:0;font-size:11px}
.posture-item.pos::before{content:'✓';color:#97C459}
.posture-item.neg::before{content:'✕';color:#E24B4A}

/* events */
.events-list{display:flex;flex-direction:column;gap:5px}
.event-row{display:flex;gap:9px;align-items:flex-start;background:#0f0f0f;border-radius:6px;padding:6px 9px}
.event-date{font-size:10px;font-weight:700;color:#EF9F27;width:52px;flex-shrink:0;line-height:1.3}
.event-name{font-size:10.5px;color:#ddd;font-weight:500}
.event-why{font-size:9.5px;color:#555;line-height:1.4}
.event-row.validation{border-left:2px solid #EF9F27}

/* Raw data (bottom layer) */
.sec{margin-bottom:16px}
.sl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#3a3a3a;font-weight:600;border-bottom:1px solid #1a1a1a;padding-bottom:5px;margin-bottom:8px;display:flex;justify-content:space-between}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.card{background:#181818;border:1px solid #252525;border-radius:8px;padding:10px 12px;cursor:pointer;user-select:none;min-width:0}
.card.red{border-color:#3a1a1a;background:#1a1212}
.card.amber{border-color:#2e2800}
.card.green{border-color:#1a2e1a}
.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin-bottom:5px}
.cl{font-size:9.5px;color:#666;line-height:1.3;flex:1}
.cc{font-size:8.5px;color:#3a3a3a;background:#111;padding:1px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0}
.cv{font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1;color:#f0f0f0;font-family:ui-monospace,'SF Mono',monospace;margin-bottom:3px}
.cd{font-size:10px;min-height:13px;color:#777}
.chain{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.footer-bar{font-size:9px;color:#3a3a3a;margin-top:16px;cursor:pointer}
.footer-detail{display:none;font-size:9px;color:#2e2e2e;margin-top:4px;line-height:1.8}
.footer-detail.open{display:block}
@media(max-width:600px){.chain{grid-template-columns:1fr 1fr}}
details.methodology{margin-top:6px}
details.methodology summary{font-size:9px;color:#555;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
details.methodology div{font-size:9.5px;color:#666;line-height:1.5;margin-top:5px}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading latest data…</div></div>

<script>
const C = { red:'#E24B4A', amber:'#EF9F27', green:'#97C459', grey:'#555', blue:'#4a8fd4', purple:'#8f6fd4' };
const col = k => C[k] || C.grey;
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
function fmt(n,d){ return (n===null||n===undefined) ? '—' : Number(n).toFixed(d===undefined?2:d) }
function levelColor(lvl){
  if(!lvl) return 'grey';
  const l = lvl.toUpperCase();
  if(l.includes('CRITICAL')) return 'red';
  if(l.includes('HIGH') && !l.includes('LOW')) return l.includes('LOW-MOD')?'amber':(l==='HIGH'?'amber':'amber');
  if(l.includes('MODERATE')||l.includes('MEDIUM')||l.includes('WATCH')) return 'amber';
  if(l.includes('LOW')) return 'green';
  return 'grey';
}
function levelWidth(lvl){
  const l=(lvl||'').toUpperCase();
  if(l.includes('CRITICAL')) return 100;
  if(l==='HIGH') return 82;
  if(l.includes('MODERATE-HIGH')) return 68;
  if(l.includes('LOW-MODERATE')) return 38;
  if(l.includes('MODERATE')) return 55;
  if(l.includes('MEDIUM-HIGH')) return 68;
  if(l.includes('MEDIUM')) return 50;
  if(l.includes('LOW-MEDIUM')) return 35;
  if(l==='LOW') return 20;
  return 40;
}
function statusChipClass(s){
  s=(s||'').toUpperCase();
  if(s.includes('CONFIRMED')) return 'confirmed';
  if(s.includes('PROXY')||s.includes('INDIRECT')||s.includes('AVAILABLE')) return 'proxy';
  if(s.includes('STRUCTURAL')||s.includes('EVENT-DEPENDENT')) return 'structural';
  return 'pending';
}
function freshDot(status){
  const c = status==='GREEN'?C.green:(status==='AMBER'?C.amber:C.red);
  return `<span class="fdot" style="background:${c}"></span>`;
}

function render(d) {
  const meta = d.meta || {};
  const v2 = d.v2 || {};
  const rh = v2.regime_header || {};
  const ms = v2.master_scores || {};
  const tx = v2.transmission || {};
  const ct = v2.curve_topology || {};
  const ry = v2.real_yield_breakeven || {};
  const sd = v2.structural_demand || {};
  const sat = v2.shock_absorbers_table || [];
  const adash = v2.auction_dashboard || [];
  const a6 = v2.auction_6avg || {};
  const nke = v2.next_key_events || [];
  const scen = v2.scenarios || {};
  const tp = v2.trade_posture_v2 || {};
  const takeaways = v2.key_takeaways || [];
  const pmap = v2.pressure_map || [];
  const dtt = v2.distance_to_transition || {};
  const stt = v2.state_transition || {};
  const freshness = v2.data_freshness || [];
  const confMeta = d.confidence_meta || {};
  const confBreak = confMeta.breakdown || [];
  const qqqm = v2.qqq_module || {};
  const goldm = v2.gold_module || {};
  const cryptom = v2.crypto_module || {};

  const regimeColor = (ms.system_regime||'').includes('Controlled Tightening') ? 'green'
    : (ms.system_regime||'').includes('Contraction') ? 'red'
    : (ms.system_regime||'').includes('Risk-On') ? 'green' : 'amber';

  // ============ ROW 1a: CURRENT REGIME ============
  const row1a = `
  <div class="panel">
    <div class="panel-hd"><span><span class="section-num">1.</span>Current Regime</span></div>
    <div class="regime-box ${regimeColor}">
      <div class="regime-badge">${rh.provisional?'PROVISIONAL':'CONFIRMED'}</div>
      <div class="regime-title" style="color:${col(regimeColor)}">${esc(rh.label||'—')}</div>
      <div class="regime-oneliner">${esc(rh.one_liner||'')}</div>
    </div>
    <div class="conf-row">
      <span class="conf-lbl">Regime Confidence</span>
      <span class="conf-val" style="color:${(rh.confidence_level||'').includes('LOW')?C.red:((rh.confidence_level||'').includes('MEDIUM')?C.amber:C.green)}">${esc(rh.confidence_level||d.regime_confidence||'—')}</span>
    </div>
  </div>`;

  // ============ ROW 1b: MASTER SCORES ============
  const mr = ms.monetary_restrictiveness||{}, lr = ms.liquidity_resilience||{};
  const row1b = `
  <div class="panel">
    <div class="panel-hd"><span><span class="section-num">2.</span>Master Scores</span></div>
    <div class="score-block">
      <div class="score-top"><span class="score-name">Monetary Restrictiveness</span><span class="score-num" style="color:${col('amber')}">${mr.value}/100</span></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${mr.value}%;background:${C.amber}"></div></div>
      <div class="score-label">${esc(mr.label||'')}</div>
    </div>
    <div class="score-block" style="margin-bottom:4px">
      <div class="score-top"><span class="score-name">Liquidity Resilience</span><span class="score-num" style="color:${col('green')}">${lr.value}/100</span></div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${lr.value}%;background:${C.green}"></div></div>
      <div class="score-label">${esc(lr.label||'')}</div>
    </div>
    <div class="matrix-note">HIGH restrictiveness × HIGH resilience → <b style="color:${col(regimeColor)}">${esc(ms.system_regime||'')}</b>. Regime is derived from this matrix every run, not hardcoded.</div>
  </div>`;

  // ============ ROW 1c: SIGNAL SUMMARY ============
  const sigRows = [
    ['Curve topology (1wk)', esc(ct.classification||'—'), levelColor(ct.interpretation)],
    ['Real yield / breakeven', esc(ry.classification||'—'), 'amber'],
    ['HY / IG credit', `${(d.credit||{}).hy_oas}% / ${(d.credit||{}).ig_oas}%`, 'green'],
    ['MOVE index', `${fmt((d.duration||{}).move,1)}`, (d.duration||{}).move>80?'red':'green'],
    ['SOFR − IORB', `${fmt((d.plumbing||{}).sofr_iorb_bps,1)}bp`, 'green'],
    ['Long-duration auctions (10/20/30Y)', 'STRONG (3/3)', 'green'],
    ['Korea gate', `${(d.korea_gate||{}).conditions_met}/3 — ${(d.korea_gate||{}).status==='open'?'OPEN':'CLOSED'}`, (d.korea_gate||{}).status==='open'?'green':'amber'],
    ['RRP buffer', `$${fmt((d.plumbing||{}).rrp_b,3)}B`, 'amber'],
  ];
  const sigHtml = sigRows.map(([l,v,c])=>`<tr><td><span class="dot" style="background:${col(c)}"></span>${esc(l)}</td><td style="color:${col(c)}">${v}</td></tr>`).join('');
  const row1c = `
  <div class="panel">
    <div class="panel-hd"><span><span class="section-num">3.</span>Current Signal Summary</span></div>
    <table class="sig-table">${sigHtml}</table>
  </div>`;

  // ============ ROW 2: TRANSMISSION ARCHITECTURE (full width) ============
  const boxes = [
    {cls:'', title:'Drivers', items:(tx.drivers||[]), state:null},
    {cls:'', title:'Monetary Restrictiveness', items:(tx.monetary_restrictiveness||{}).bullets||[], state:(tx.monetary_restrictiveness||{}).state, stateColor:'amber'},
    {cls:'purple', title:'Official-Sector Shock Absorbers', items:(tx.shock_absorbers||{}).bullets||[], state:(tx.shock_absorbers||{}).state, stateColor:'purple'},
    {cls:'blue', title:'Market Liquidity Outcome', items:(tx.market_liquidity_outcome||{}).bullets||[], state:(tx.market_liquidity_outcome||{}).state, stateColor:'green'},
    {cls:'', title:'Market Impact', items:(tx.market_impact||{}).bullets||[], state:(tx.market_impact||{}).state, stateColor:'amber'},
  ];
  const txHtml = boxes.map((b,i) => `
    ${i>0?'<div class="tx-arrow">→</div>':''}
    <div class="tx-box ${b.cls}">
      <div class="tx-title">${esc(b.title)}</div>
      ${(b.items||[]).map(it=>`<div class="tx-item">• ${esc(it)}</div>`).join('')}
      ${b.state?`<div class="tx-state" style="color:${col(b.stateColor)}">${esc(b.state)}</div>`:''}
    </div>`).join('');
  const row2 = `
  <div class="panel">
    <div class="panel-hd"><span><span class="section-num">4.</span>Transmission Architecture <span class="sub">where we are now — drivers → restrictiveness → shock absorbers → market outcome → impact</span></span></div>
    <div class="tx-flow">${txHtml}</div>
  </div>`;

  // ============ ROW 3: bottom line / why this regime / confidence decomposition ============
  const evidenceItems = [
    ["Monetary restrictiveness elevated", mr.bucket==='HIGH'],
    ["Real yields elevated", (d.breakevens||{}).dfii5>1.5],

      </div>`).join('')}
    </div>
  </div>

  <div class="sec">
    <div class="sl">FX &amp; regional — structural</div>
    <div class="g4">
      ${[
        {l:'USDJPY',v:fx.usdjpy,d:'BOJ threshold 162',c:fx.usdjpy_alert?'red':'green'},
        {l:'USDKRW',v:fx.usdkrw,d:'Gate threshold 1,530',c:fx.usdkrw_pass?'green':'red'},
        {l:'DXY',v:fx.dxy,d:'—',c:'grey'},
      ].map(x=>`<div class="card ${x.c}">
        <div class="ct"><span class="cl">${esc(x.l)}</span><span class="cc">Live</span></div>
        <div class="cv">${esc(String(x.v))}</div>
        <div class="cd" style="color:${col(x.c)}">${x.d}</div>
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
      <div class="chip pending" style="background:#1a1a1a;color:#888">JP10Y: ${fx.jp10y}%</div>
      <div class="chip pending" style="background:#1a1a1a;color:#888">NI225: ${(fx.ni225/1000).toFixed(1)}K</div>
      <div class="chip pending" style="background:#1a1a1a;color:#888">USDCNY: ${fx.usdcny}</div>
    </div>
  </div>

  <div class="sec">
    <div class="sl">Korea gate — 3-condition framework</div>
    <div style="background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
        <div><div style="font-size:10px;color:#666;margin-bottom:2px">EWY</div><div style="font-size:24px;font-weight:700;font-family:ui-monospace,'SF Mono',monospace">$${kg.ewy}</div></div>
        <div style="background:${kgOpen?'#121a12':'#1a1212'};border:1px solid ${kgOpen?'#1a3a1a':'#3a1a1a'};border-radius:6px;padding:8px 14px;text-align:center">
          <div style="font-size:9px;color:#888;text-transform:uppercase">Gate status</div>
          <div style="font-size:15px;font-weight:700;color:${kgOpen?C.green:C.red}">${kgOpen?'✓ OPEN':'✗ CLOSED'} — ${kg.conditions_met}/3</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px">
        ${condCard('EWY > SMA20', kg.ewy_pass, `$${kg.ewy} vs SMA20 $${kg.ewy_sma20}`)}
        ${condCard('USDKRW < 1,530', kg.usdkrw_pass, `${kg.usdkrw} vs 1,530`)}
        ${condCard('KOSPI > 5D SMA', kg.kospi_pass, `${kg.kospi} vs SMA5 ${kg.kospi_sma5}`)}
      </div>
      <div style="font-size:9.5px;color:#555;margin-top:8px">${esc(kg.note||'')}</div>
    </div>
  </div>

  <div class="sec">
    <div class="sl">Semis pulse — tactical</div>
    <div class="g4">
      ${[{l:'SOXX',v:'$'+sm.soxx,c:'grey'},{l:'QQQ',v:'$'+sm.qqq,c:'grey'},{l:'SPY',v:'$'+sm.spy,c:'grey'},{l:'SOXX/SPY ratio',v:sm.soxx_spy_ratio,c:'grey'}]
        .map(x=>`<div class="card ${x.c}"><div class="ct"><span class="cl">${esc(x.l)}</span><span class="cc">Live</span></div><div class="cv">${esc(String(x.v))}</div></div>`).join('')}
    </div>
  </div>

  <div class="sec">
    <div class="sl">Enabling-layer thesis chain</div>
    <div class="chain">${chainCards}</div>
    <div style="font-size:9.5px;color:#3a3a3a;margin-top:6px">${esc(d.chain_note||'')}</div>
  </div>

  <div class="sec">
    <div class="sl">Macro cross-checks — tactical</div>
    <div class="g4">
      ${(()=>{
        const labels = {vix:'VIX', oil:'CL1! — Crude oil', gold:'GOLD', move:'MOVE — Bond vol'};
        return Object.entries(labels).map(([k,l])=>{
          const x = cx[k] || {value:'—'};
          return `<div class="card grey"><div class="ct"><span class="cl">${l}</span><span class="cc">Live</span></div><div class="cv">${esc(String(x.value))}</div></div>`;
        }).join('');
      })()}
    </div>
  </div>`;

  document.getElementById('app').innerHTML = `
  <div class="hdr">
    <div>
      <div class="eyebrow">Fat Cat Capital</div>
      <h1>Liquidity Monitor 2.1 — Current-State Decision System</h1>
      <div class="tagline">Where are we · how certain · why · where's the pressure · what absorbs it · what changes it</div>
    </div>
    <div class="ts"><div class="live">● Live</div>Last updated<br>${esc(meta.pulled_at_cet||'')}</div>
  </div>

  <div class="layer-lbl">Row 1 — regime, scores, signal (fits one viewport)</div>
  <div class="row1">${row1a}${row1b}${row1c}</div>

  <div class="layer-lbl">Row 2 — transmission architecture</div>
  ${row2}

  <div class="layer-lbl">Row 3 — bottom line, why, confidence</div>
  <div class="row3">${row3a}${row3b}${row3c}</div>

  <div class="layer-lbl">Detailed analytical dashboards</div>
  ${secPressure}
  <div class="dash-grid">${secCurve}${secReal}${secVol}</div>
  ${secStructural}
  ${secAbsorbers}
  ${secAuctions}
  ${secScenarios}
  ${secPosture}
  ${secEvents}
  ${secFreshness}

  <div class="layer-lbl">Raw liquidity / market data</div>
  ${rawData}

  <div class="footer-bar" onclick="this.nextElementSibling.classList.toggle('open')">ⓘ Data sources &amp; methodology notes</div>
  <div class="footer-detail">
    FRED: WALCL · WTREGEN · RRPONTSYD · WRESBAL · SOFR · IORB · DFII5/7/10/20/30 · BAMLC0A0CM (IG OAS) · BAMLH0A0HYM2 (HY OAS) |
    TradingView "Liquidity Monitor - Jae" watchlist | ICI weekly Money Market Fund Assets release | DefiLlama aggregate stablecoin market cap |
    TreasuryDirect TA_WS (auction results, incl. 10Y/20Y/30Y regime-validation auctions) | NY Fed primary dealer statistics |
    Monetary Restrictiveness &amp; Liquidity Resilience: documented v1 scoring, refined each run as more history accumulates |
    SOMA composition, Treasury buybacks/issuance mix, bank/corporate Treasury holdings, and FIMA usage are explicitly PENDING DATA — never fabricated |
    Curve topology, real-yield classification, pressure map, and distance-to-transition are derived/rule-based, not raw feeds |
    Key takeaways this run: ${takeaways.map(esc).join(' · ')}
  </div>`;
}

async function load() {
  try {
    const r = await fetch('data/latest.json?v=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    render(d);
  } catch(e) {
    document.getElementById('app').innerHTML = `
      <div class="hdr"><div><div class="eyebrow">Fat Cat Capital</div><h1>Liquidity Monitor 2.1</h1></div></div>
      <div class="err">Failed to load latest.json: ${esc(e.message)}<br><br>
      This usually means the data file hasn't been pushed yet, or there's a network issue.</div>`;
  }
}
load();
</script>
</body>
</html>
